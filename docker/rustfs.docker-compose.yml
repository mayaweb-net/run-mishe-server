services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: run-mishe-rustfs
    restart: unless-stopped
    ports:
      - '${RUSTFS_API_PORT:-19000}:9000'
      - '${RUSTFS_CONSOLE_PORT:-19001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-run-mishe}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-run-mishe-s3-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    volumes:
      - rustfs-data:/data
    command: ['/data']
    networks:
      - run-mishe

volumes:
  rustfs-data:

networks:
  run-mishe:
    name: run-mishe
